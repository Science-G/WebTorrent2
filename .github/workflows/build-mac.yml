name: build-mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    name: DMG arm64
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify npm signatures and provenance
        run: npm audit signatures

      - name: Security tests
        run: node test/security.mjs

      - name: Engine tests
        run: node test/core.mjs

      - name: Interface tests
        run: node test/ui.mjs

      - name: Generate the icons
        run: |
          python3 scripts/make-tray-icon.py
          python3 scripts/make-app-icon.py

      - name: Build, sign and check the app
        run: npx electron-builder --mac dmg zip --arm64 --publish never

      - name: SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebTorrent2-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
